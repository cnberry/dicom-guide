name: Native release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Publish this exact version tag from main, for example v0.16.0;
          leave blank for a build-only run
        required: false
        type: string
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.event_name }}-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
          - platform: macos-x86_64
            os: macos-15-intel
          - platform: macos-arm64
            os: macos-15
          - platform: windows-x86_64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: python scripts/build_native_distribution.py --output-dir release
      - if: runner.os != 'Windows'
        name: Smoke test Unix package
        shell: bash
        run: |
          archives=(release/dicom-guide-*-${{ matrix.platform }}.tar.gz)
          if [ "${#archives[@]}" -ne 1 ] || [ ! -f "${archives[0]}" ]; then
            echo "Expected exactly one ${{ matrix.platform }} archive" >&2
            exit 1
          fi
          archive="${archives[0]}"
          (cd release && shasum -a 256 -c "$(basename "$archive").sha256")
          extract="$RUNNER_TEMP/dicom-guide-package"
          mkdir -p "$extract"
          tar -xzf "$archive" -C "$extract"
          bundles=("$extract"/dicom-guide-*-${{ matrix.platform }})
          if [ "${#bundles[@]}" -ne 1 ] || [ ! -d "${bundles[0]}" ]; then
            echo "Expected exactly one extracted ${{ matrix.platform }} package" >&2
            exit 1
          fi
          bundle="${bundles[0]}"
          prefix="$RUNNER_TEMP/dicom-guide-install"
          DICOM_GUIDE_PREFIX="$prefix" sh "$bundle/install.sh"
          "$prefix/bin/dicom-guide" --version
      - if: runner.os == 'Windows'
        name: Smoke test Windows package
        shell: pwsh
        run: |
          $archive = Get-ChildItem release/dicom-guide-*-windows-x86_64.zip | Select-Object -First 1
          $expected = (Get-Content "$($archive.FullName).sha256").Split()[0]
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive.FullName).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Release checksum mismatch" }
          $extract = Join-Path $env:RUNNER_TEMP "dicom-guide-package"
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $extract
          $bundle = Get-ChildItem $extract -Directory | Select-Object -First 1
          $installRoot = Join-Path $env:RUNNER_TEMP "DICOM Guide"
          & (Join-Path $bundle.FullName "install.ps1") -InstallRoot $installRoot
          & (Join-Path $installRoot "bin\dicom-guide.cmd") --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dicom-guide-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish signed release
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - if: github.event_name == 'workflow_dispatch'
        name: Require main for a manual release
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Manual releases must run from main, not $GITHUB_REF" >&2
            exit 1
          fi
      - name: Require a commit from main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit $GITHUB_SHA is not on main" >&2
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dicom-guide-*
          path: release
          merge-multiple: true
      - name: Validate the complete release set
        run: python scripts/prepare_native_release.py --tag "$RELEASE_TAG" release
      - if: github.event_name == 'workflow_dispatch'
        name: Create the verified release tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          existing=""
          if candidate=$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
              --jq .object.sha 2>/dev/null
          ); then
            existing="$candidate"
          fi
          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "$RELEASE_TAG already points to a different commit" >&2
            exit 1
          fi
          if [ -z "$existing" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
          fi
      - name: Create the SLSA provenance predicate
        shell: bash
        run: |
          python scripts/create_release_provenance.py \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --repository-owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --ref "$GITHUB_REF" \
            --sha "$GITHUB_SHA" \
            --event-name "$GITHUB_EVENT_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --release-tag "$RELEASE_TAG" \
            "$RUNNER_TEMP/release-provenance.json"
      - name: Install the Sigstore client
        run: python -m pip install "sigstore==4.5.0"
      - name: Sign and verify build provenance
        shell: bash
        run: |
          bundle="release/dicom-guide-${RELEASE_TAG}-provenance.sigstore.json"
          python -m sigstore attest \
            --predicate "$RUNNER_TEMP/release-provenance.json" \
            --predicate-type "https://slsa.dev/provenance/v1" \
            --bundle "$bundle" \
            release/SHA256SUMS
          python -m sigstore verify github \
            --bundle "$bundle" \
            --cert-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --repository "$GITHUB_REPOSITORY" \
            --trigger "$GITHUB_EVENT_NAME" \
            --sha "$GITHUB_SHA" \
            --name "$GITHUB_WORKFLOW" \
            --ref "$GITHUB_REF" \
            release/SHA256SUMS
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh release create "$RELEASE_TAG" release/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          --title "DICOM Guide ${RELEASE_TAG#v}"
