[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dicom-guide"
version = "0.15.0"
description = "Local MRI and CT viewer built for people and their agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydicom>=3.0.1,<4",
]

[project.optional-dependencies]
test = [
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<10",
]
interop = [
  "highdicom==0.28.1",
  "numpy==2.5.2",
  "pydicom==3.0.2",
]
dcmqi-interop = [
  "dcmqi==1.5.6",
  "pydicom==3.0.2",
]

[project.scripts]
dicom-guide = "dicom_guide.public_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/dicom_guide"]
