[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "scanview-agent"
version = "0.3.0"
description = "Privacy-conscious, source-read-only DICOM catalog and local API for ScanView"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pydicom>=3.0.1,<4",
]

[project.optional-dependencies]
test = [
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<10",
]

[project.scripts]
scanview-agent = "scanview_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/scanview_agent"]
